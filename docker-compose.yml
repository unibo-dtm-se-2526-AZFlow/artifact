services:
  azflow:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      AZFLOW_API_HOST: ${AZFLOW_API_HOST:-0.0.0.0}
      AZFLOW_API_PORT: ${AZFLOW_API_PORT:-8000}
      AZFLOW_DATABASE_URL: postgresql://${POSTGRES_USER:-azflow}:${POSTGRES_PASSWORD:-azflow}@postgres:5432/${POSTGRES_DB:-azflow}
    ports:
      - "${AZFLOW_API_PORT:-8000}:${AZFLOW_API_PORT:-8000}"

  adminer:
    image: adminer:latest
    profiles:
      - dev
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-azflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-azflow}
      POSTGRES_DB: ${POSTGRES_DB:-azflow}
    ports:
      - "${AZFLOW_DB_HOST_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./AZFlow/infrastructure/persistence/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - ./AZFlow/infrastructure/persistence/seed_data.sql:/docker-entrypoint-initdb.d/seed_data.sql:ro

volumes:
  pgdata:
