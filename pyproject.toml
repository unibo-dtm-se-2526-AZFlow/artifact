[tool.poetry]
name = "AZFlow"
packages = [
    { include = "AZFlow" },
]
# Alembic revision scaffolding stays in the Git repository for developers.
# It is not required to apply packaged migrations.
exclude = [
    "AZFlow/migrations/README",
    "AZFlow/migrations/script.py.mako",
]
version = "2.0.1"
description = "AZFlow, a healthcare queue management system for outpatient environments"
authors = ["Andrea Zaccheroni <andrea.zaccheroni@studio.unibo.it>"]
license = "Apache 2.0"
readme = "docs/PYPI_README.md"

[tool.poetry.dependencies]
# update the Python versions in .github/workflows/check.yml if you change this
python = ">= 3.10.0 < 4.0.0"
fastapi = "^0.115.0"
uvicorn = { version = "^0.30.0", extras = ["standard"] }
psycopg = { version = "^3.2.0", extras = ["binary"] }
pydantic-settings = "^2.5.0"
alembic = "^1.16.0"

[tool.poetry.group.dev.dependencies]
coverage = "^7.4.0"
mypy = "^1.10.1"
poethepoet = "^0.37.0"
poetry = "^1.8.3"
pytest = "^8.3.5"
ruff = "^0.15.0"
httpx = "^0.28.1"

[tool.poe.tasks]
test = { cmd = "pytest", help = "Run the unit test suite" }
test-integration = { cmd = "python scripts/test.py", help = "Run integration tests against a disposable database" }
coverage = { cmd = "coverage run -m pytest", help = "Run tests and collect coverage data" }
coverage-report = { cmd = "coverage report -m", help = "Show the coverage report" }
coverage-html = { cmd = "coverage html", help = "Generate the HTML coverage report" }
ruff-check = { cmd = "ruff check", help = "Check Python code with Ruff" }
ruff-fix = { cmd = "ruff check --fix", help = "Fix Ruff issues when possible" }
format = { cmd = "ruff format", help = "Format Python code with Ruff" }
format-check = { cmd = "ruff format --check", help = "Check Python formatting with Ruff" }
mypy = { cmd = "mypy AZFlow tests", help = "Run static type checks" }
compile = { cmd = "python -m compileall AZFlow tests", help = "Compile Python sources to check syntax" }
static-checks = { sequence = ["ruff-check", "mypy"], help = "Run linting and static type checks" }
dev = { cmd = "python scripts/dev.py", help = "Start PostgreSQL, Adminer, demo gateway, and AZFlow for development" }
dev-reset = { cmd = "python scripts/dev.py reset", help = "Recreate, migrate, and seed the development database (deletes existing data)" }
dev-stop = { cmd = "python scripts/stop.py", help = "Stop AZFlow and all development services without deleting database data" }
db-upgrade = { cmd = "alembic upgrade head", help = "Upgrade the configured database to the latest migration" }
db-current = { cmd = "alembic current", help = "Show the current database migration revision" }
db-history = { cmd = "alembic history", help = "Show the database migration history" }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
